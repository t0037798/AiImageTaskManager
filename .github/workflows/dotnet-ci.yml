name: .NET CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AiImageTaskManager.slnx

      - name: Build
        run: dotnet build AiImageTaskManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AiImageTaskManager.slnx --configuration Release --no-build --verbosity normal